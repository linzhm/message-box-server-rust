name: Rust source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libsqlite3-dev
      - name: Select Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.94.1 fmt --check
      - run: cargo +1.94.1 test --locked --all-targets
      - run: cargo +1.94.1 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.94.1 build --locked --release --bin message-box-server
      - run: cargo +1.94.1 doc --locked --no-deps
