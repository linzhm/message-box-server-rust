[package]
name = "message-box-server-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
license-file = "LICENSE.txt"
description = "Experimental Rust MessageBox application core; not a production-compatible server"

[dependencies]
google-cloud-auth = { version = "=1.18.0", default-features = false }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
ring = "=0.17.14"
bytes = "=1.12.1"
http-body = "=1.1.0"
http-body-util = "=0.1.5"
hyper = { version = "=1.11.1", features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "signal", "sync"] }
base64 = "=0.22.1"
getrandom = "=0.4.3"
hmac = "=0.12.1"
http = "=1.5.0"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "stream"] }
url = "=2.5.8"
sha2 = "=0.10.9"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
hex = "=0.4.3"
futures-util = "=0.3.34"
tokio-tungstenite = "=0.24.0"
k256 = { version = "=0.13.4", default-features = false, features = ["arithmetic", "ecdsa"] }
serde_json = { version = "=1.0.150", features = ["float_roundtrip", "preserve_order", "raw_value"] }
serde = "=1.0.229"
ryu-js = "=1.0.3"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
ripemd = "=0.1.3"

[dev-dependencies]
tempfile = "=3.27.0"
rcgen = "=0.13.2"
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["ring", "tls12"] }
